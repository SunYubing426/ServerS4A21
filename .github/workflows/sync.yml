# 自动备份同步：每天从 gitgud.io/rewio/ServerS4A21 拉最新内容，同步到本仓库的 upstream-backup 分支。
#
# 架构：
#   - **master** 是你的定制版（上游 + 你的修复），本工作流**永远不会动 master**。
#   - **upstream-backup** 每天自动更新为"纯上游"备份：树与 gitgud 源码 100% 一致、历史线性。
#   - 本文件放在 master（默认分支）上，GitHub 定时任务从默认分支读取执行，因此无需切换默认分支。
#
# 上游更新同步到你的定制版（在你电脑上）：
#   git fetch origin upstream-backup
#   git rebase origin/upstream-backup    # 有冲突: 解决 → git add . → git rebase --continue
#   git push origin master
#
# 手动触发：本仓库页 → Actions → "Sync from gitgud" → Run workflow。
name: Sync from gitgud

on:
  schedule:
    # 每天 03:23 UTC（北京时间每天 11:23）
    - cron: "23 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: sync-from-gitgud
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mirror the source repo from gitgud
        run: |
          rm -rf /tmp/source.git
          git clone --mirror https://gitgud.io/rewio/ServerS4A21.git /tmp/source.git

      - name: Push pure upstream to upstream-backup (master stays untouched)
        env:
          # GITHUB_TOKEN 不是自动注入的环境变量，必须显式传给这一步才能用于 git 推送鉴权
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git -C /tmp/source.git push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            'refs/heads/master:refs/heads/upstream-backup' \
            'refs/tags/*:refs/tags/*'
